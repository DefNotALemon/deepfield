<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEEPFIELD — a space extraction shooter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="DEEPFIELD: contract salvage on the Rim. Every site is somebody's bad day, every haul has to be carried out by hand, and the operators above you will board your run for it.">
<link rel="stylesheet" href="style.css">
</head>
<body data-scheme="kb">
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="panel"></div>
<div id="cruise"></div>
<div id="hints"></div>
<div id="pause"></div>

<div id="touch">
  <button data-a="interact">USE</button><button data-a="bag">HAUL</button><button data-a="torch">LAMP</button>
  <button data-a="tool">TOOL</button><button data-a="sprint">RUN</button><button data-a="crouch">DUCK</button>
  <button data-a="jump">JUMP</button><button data-a="aim">AIM</button><button data-a="fire">FIRE</button>
  <button data-a="reload">RELOAD</button><button data-a="drop">DROP</button><button data-a="tablet">TABLET</button>
</div>

<div id="title"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
